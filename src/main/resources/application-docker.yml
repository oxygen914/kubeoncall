spring:
  data:
    redis:
      host: redis
      port: 6379
  elasticsearch:
    uris: http://elasticsearch:9200

kubeoncall:
  rag:
    knowledge-index-alias: ${RAG_KNOWLEDGE_INDEX_ALIAS:kubeoncall-knowledge-active}
    active-dataset-version: ${RAG_ACTIVE_DATASET_VERSION:}
    vector-enabled: true
    vector-backend: es
    es-knn-enabled: true
    embedding-enabled: true
    mock-embedding-enabled: false
    embedding-endpoint: ${RAG_EMBEDDING_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings}
    embedding-api-key: ${RAG_EMBEDDING_API_KEY:${ALIYUN_API_KEY:}}
    embedding-model: ${RAG_EMBEDDING_MODEL:text-embedding-v4}
    embedding-version: ${RAG_EMBEDDING_VERSION:v1}
    embedding-dimensions: ${RAG_EMBEDDING_DIMENSIONS:1536}
    embedding-timeout-millis: ${RAG_EMBEDDING_TIMEOUT_MILLIS:3000}
    cross-encoder-enabled: true
    cross-encoder-endpoint: ${RAG_RERANK_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
    cross-encoder-api-key: ${RAG_RERANK_API_KEY:${ALIYUN_API_KEY:}}
    cross-encoder-model: ${RAG_RERANK_MODEL:qwen3-rerank}
    cross-encoder-timeout-millis: ${RAG_RERANK_TIMEOUT_MILLIS:3000}
    runbook-bootstrap-enabled: true
  storage:
    minio:
      endpoint: http://minio:9000
      access-key: ${MINIO_ROOT_USER:minioadmin}
      secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
      bucket: kubeoncall-docs
  mcp:
    endpoint: ${MCP_ENDPOINT:http://host.docker.internal:18080/mcp/call}
    api-key: ${MCP_API_KEY:}
    discovery-enabled: ${MCP_DISCOVERY_ENABLED:false}
    discovery-endpoint: ${MCP_DISCOVERY_ENDPOINT:}
    discovery-cache-seconds: ${MCP_DISCOVERY_CACHE_SECONDS:60}
    dynamic-invocation-enabled: ${MCP_DYNAMIC_INVOCATION_ENABLED:false}
    dynamic-max-tools: ${MCP_DYNAMIC_MAX_TOOLS:3}
  integrations:
    kubernetes:
      endpoint: ${KUBERNETES_TOOL_ENDPOINT:http://host.docker.internal:18081/api/tools/kubernetes}
    prometheus:
      endpoint: ${PROMETHEUS_TOOL_ENDPOINT:http://host.docker.internal:18082/api/tools/prometheus}
    alertmanager:
      endpoint: ${ALERTMANAGER_TOOL_ENDPOINT:http://host.docker.internal:18083/api/tools/alertmanager}
    incident:
      endpoint: ${INCIDENT_TOOL_ENDPOINT:http://host.docker.internal:18087/api/tools/incident}
    device:
      endpoint: ${DEVICE_TOOL_ENDPOINT:http://host.docker.internal:18084/api/tools/device}
    database:
      endpoint: ${DATABASE_TOOL_ENDPOINT:http://host.docker.internal:18085/api/tools/database}
  alarm:
    recovery-health-check-required: true
    recovery-health-check-endpoint: ${ALARM_RECOVERY_HEALTH_CHECK_ENDPOINT:http://host.docker.internal:18088/api/health/alarm-recovery}
    recovery-health-check-timeout-millis: ${ALARM_RECOVERY_HEALTH_CHECK_TIMEOUT_MILLIS:3000}
    recovery-confirmation-timeout-seconds: ${ALARM_RECOVERY_CONFIRMATION_TIMEOUT_SECONDS:86400}
  memory:
    llm-extraction-enabled: ${MEMORY_LLM_EXTRACTION_ENABLED:false}
    llm-extraction-endpoint: ${MEMORY_LLM_EXTRACTION_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
    llm-extraction-api-key: ${MEMORY_LLM_EXTRACTION_API_KEY:${ALIYUN_API_KEY:}}
    llm-extraction-model: ${MEMORY_LLM_EXTRACTION_MODEL:qwen-plus}
