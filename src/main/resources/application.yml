spring:
  application:
    name: kubeoncall
  profiles:
    active: local
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
    elasticsearch:
      repositories:
        enabled: false
  elasticsearch:
    uris: http://localhost:9200
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8080

kubeoncall:
  agent:
    max-loops: 3
    planner-llm-enabled: true
  approval:
    enabled: true
    callback-timeout-seconds: 1800
    repository: redis
  rag:
    default-top-k: 5
    knowledge-index: kubeoncall-knowledge
    vector-enabled: false
    vector-endpoint: http://localhost:18086/api/vector/search
    vector-timeout-millis: 3000
    cross-encoder-enabled: false
    cross-encoder-endpoint: http://localhost:18086/api/rerank
    cross-encoder-timeout-millis: 3000
    lexical-candidate-top-n: 20
    vector-candidate-top-n: 20
    rrf-k: 60
    rerank-top-n: 20
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: kubeoncall-docs
  mcp:
    enabled: true
    server-name: local-mcp
    endpoint: http://localhost:18080/mcp/call
    timeout-millis: 3000
  integrations:
    kubernetes:
      endpoint: http://localhost:18081/api/tools/kubernetes
      timeout-millis: 3000
    prometheus:
      endpoint: http://localhost:18082/api/tools/prometheus
      timeout-millis: 3000
    alertmanager:
      endpoint: http://localhost:18083/api/tools/alertmanager
      timeout-millis: 3000
    device:
      endpoint: http://localhost:18084/api/tools/device
      timeout-millis: 3000
    database:
      endpoint: http://localhost:18085/api/tools/database
      timeout-millis: 3000
  workflow:
    alarm-dedup-ttl-seconds: 600
  audit:
    repository: redis
    retention-hours: 168
