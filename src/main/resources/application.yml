spring:
  application:
    name: kubeoncall
  profiles:
    active: local
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
    elasticsearch:
      repositories:
        enabled: false
  elasticsearch:
    uris: http://localhost:9200
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

server:
  port: 8080

kubeoncall:
  agent:
    max-loops: 3
    planner-llm-enabled: true
  approval:
    enabled: true
    callback-timeout-seconds: 1800
    repository: redis
  rag:
    default-top-k: 5
    knowledge-index: kubeoncall-knowledge
    active-dataset-version: ${RAG_ACTIVE_DATASET_VERSION:}
    vector-enabled: false
    vector-backend: es
    vector-endpoint: http://localhost:18086/api/vector/search
    vector-timeout-millis: 3000
    es-knn-enabled: false
    embedding-enabled: false
    mock-embedding-enabled: false
    embedding-endpoint: http://localhost:18086/api/embedding
    embedding-api-key: ${RAG_EMBEDDING_API_KEY:}
    embedding-model: text-embedding-3-small
    embedding-version: v1
    embedding-timeout-millis: 3000
    embedding-dimensions: 1536
    chunk-strategy: recursive
    chunk-size: 280
    chunk-overlap: 0
    cross-encoder-enabled: false
    cross-encoder-endpoint: http://localhost:18086/api/rerank
    cross-encoder-api-key: ${RAG_RERANK_API_KEY:}
    cross-encoder-model: cross-encoder
    cross-encoder-timeout-millis: 3000
    lexical-candidate-top-n: 20
    vector-candidate-top-n: 20
    rrf-k: 60
    rerank-top-n: 30
    runbook-location: classpath*:runbooks/*.md
    runbook-bootstrap-enabled: false
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: kubeoncall-docs
  mcp:
    enabled: true
    server-name: local-mcp
    endpoint: http://localhost:18080/mcp/call
    timeout-millis: 3000
    discovery-enabled: ${MCP_DISCOVERY_ENABLED:false}
    discovery-endpoint: ${MCP_DISCOVERY_ENDPOINT:}
    discovery-cache-seconds: ${MCP_DISCOVERY_CACHE_SECONDS:60}
  integrations:
    kubernetes:
      endpoint: http://localhost:18081/api/tools/kubernetes
      timeout-millis: 3000
    prometheus:
      endpoint: http://localhost:18082/api/tools/prometheus
      timeout-millis: 3000
    alertmanager:
      endpoint: http://localhost:18083/api/tools/alertmanager
      timeout-millis: 3000
    incident:
      endpoint: http://localhost:18087/api/tools/incident
      timeout-millis: 3000
    device:
      endpoint: http://localhost:18084/api/tools/device
      timeout-millis: 3000
    database:
      endpoint: http://localhost:18085/api/tools/database
      timeout-millis: 3000
  workflow:
    alarm-dedup-ttl-seconds: 600
  alarm:
    enabled: true
    policy-location: classpath:alarm-policies-node-mvp.yml
    default-severity: P3
    active-ttl-seconds: 86400
    resolved-retention-seconds: 3600
    p0-dedup-ttl-seconds: 1800
    p1-dedup-ttl-seconds: 1200
    p2-dedup-ttl-seconds: 600
    p3-dedup-ttl-seconds: 300
    info-dedup-ttl-seconds: 120
    node-not-ready-suppression-ttl-seconds: 1800
    escalation-ttl-seconds: 3600
    acknowledgement-ttl-seconds: 86400
    silence-approval-ttl-seconds: 1800
    p0-recovery-window-seconds: 900
    p1-recovery-window-seconds: 600
    p2-recovery-window-seconds: 300
    p3-recovery-window-seconds: 120
    info-recovery-window-seconds: 0
    recovery-state-ttl-seconds: 259200
    recovery-scheduler-enabled: true
    recovery-check-interval-millis: 30000
    recovery-batch-size: 100
    recovery-health-check-required: true
    recovery-health-check-endpoint: ${ALARM_RECOVERY_HEALTH_CHECK_ENDPOINT:}
    recovery-health-check-timeout-millis: 3000
    recovery-confirmation-timeout-seconds: 86400
    p0-escalation-count: 2
    p1-escalation-count: 3
    p0-escalation-after-seconds: 600
    p1-escalation-after-seconds: 1800
    policy-version-history-limit: 20
    p1-aggregation-window-seconds: 300
    p2-aggregation-window-seconds: 900
    p3-aggregation-window-seconds: 3600
    alertmanager-webhook-enabled: true
    alertmanager-webhook-auth-mode: bearer
    alertmanager-webhook-token: ${ALERTMANAGER_WEBHOOK_TOKEN:}
    alertmanager-webhook-token-file: ${ALERTMANAGER_WEBHOOK_TOKEN_FILE:}
    alertmanager-webhook-max-alerts-per-request: 100
    alertmanager-webhook-max-payload-bytes: 1048576
    inbox-stream-key: kubeoncall:alarm:inbox
    inbox-consumer-group: kubeoncall-alarm-workers
    inbox-dead-letter-key: kubeoncall:alarm:dead-letter
    inbox-max-retries: 5
    inbox-retention-hours: 168
    inbox-worker-enabled: true
    inbox-worker-batch-size: 10
    inbox-worker-block-millis: 1000
    inbox-pending-claim-idle-millis: 60000
  memory:
    enabled: true
    session-ttl-seconds: 86400
    max-session-turns: 12
    session-recent-turns: 6
    session-token-budget: 1200
    session-append-max-retries: 5
    session-summary-token-budget: 600
    context-token-budget: 2400
    unified-context-token-budget: 3200
    observation-token-budget: 800
    max-observation-entries: 20
    long-term-enabled: true
    inject-max-entries: 5
    stale-after-days: 30
    temporal-normalization-zone: Asia/Shanghai
    consolidation-enabled: false
    consolidation-cron: "0 0 3 * * *"
    consolidation-scan-limit: 500
    consolidation-lock-ttl-seconds: 1800
    duplicate-similarity-threshold: 0.92
    extraction-worker-enabled: true
    extraction-poll-interval-millis: 5000
    extraction-max-attempts: 3
    llm-extraction-enabled: ${MEMORY_LLM_EXTRACTION_ENABLED:false}
    llm-extraction-endpoint: ${MEMORY_LLM_EXTRACTION_ENDPOINT:}
    llm-extraction-api-key: ${MEMORY_LLM_EXTRACTION_API_KEY:}
    llm-extraction-model: ${MEMORY_LLM_EXTRACTION_MODEL:}
    llm-extraction-timeout-millis: ${MEMORY_LLM_EXTRACTION_TIMEOUT_MILLIS:5000}
    extraction-quality-threshold: ${MEMORY_EXTRACTION_QUALITY_THRESHOLD:0.55}
    tokenizer-enabled: ${MEMORY_TOKENIZER_ENABLED:false}
    tokenizer-endpoint: ${MEMORY_TOKENIZER_ENDPOINT:}
    tokenizer-api-key: ${MEMORY_TOKENIZER_API_KEY:}
    tokenizer-model: ${MEMORY_TOKENIZER_MODEL:}
    tokenizer-timeout-millis: ${MEMORY_TOKENIZER_TIMEOUT_MILLIS:2000}
  skill:
    enabled: true
    location: classpath*:skills/**/*.md
    project-location: file:./skills/**/SKILL.md
    max-active-skills: 3
    activation-threshold: 3
    prompt-max-chars: 4000
    prompt-token-budget: 900
    version-conflict-policy: ${SKILL_VERSION_CONFLICT_POLICY:PREFER_PROJECT}
  audit:
    repository: redis
    retention-hours: 168
