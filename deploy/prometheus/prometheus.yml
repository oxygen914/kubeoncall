global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: kubeoncall
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["kubeoncall:8080"]
        labels:
          service: kubeoncall
          environment: docker

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki
          environment: docker

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          service: alloy
          environment: docker

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          cluster: local
          node: docker-host
