# Governed Kubernetes mutation adapter. This workload is intentionally separate from the read-only
# evidence adapter and uses a different ServiceAccount, bearer token, Service and operation ledger.
#
# Create its credential before applying:
#   kubectl -n kubeoncall-operations create secret generic kubernetes-mutation-adapter-auth \
#     --from-literal=token='<at-least-32-random-characters>'
#
# The default action allowlist excludes patchConfig. Enable it only together with an explicit
# KUBERNETES_MUTATION_ADAPTER_ALLOWED_CONFIG_KEYS list and matching read-adapter config.
apiVersion: v1
kind: Namespace
metadata:
  name: kubeoncall-operations
  labels:
    app.kubernetes.io/part-of: kubeoncall
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mutation-adapter
  namespace: kubeoncall-operations
  labels:
    app.kubernetes.io/name: kubernetes-mutation-adapter
    app.kubernetes.io/part-of: kubeoncall
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-mutation-operation-ledger
  namespace: kubeoncall-operations
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-mutation-operation-ledger
  namespace: kubeoncall-operations
subjects:
  - kind: ServiceAccount
    name: kubernetes-mutation-adapter
    namespace: kubeoncall-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernetes-mutation-operation-ledger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-mutation-targets
  namespace: kubeoncall-system
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-mutation-targets
  namespace: kubeoncall-system
subjects:
  - kind: ServiceAccount
    name: kubernetes-mutation-adapter
    namespace: kubeoncall-operations
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernetes-mutation-targets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mutation-adapter
  namespace: kubeoncall-operations
  labels:
    app.kubernetes.io/name: kubernetes-mutation-adapter
    app.kubernetes.io/part-of: kubeoncall
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mutation-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-mutation-adapter
        app.kubernetes.io/part-of: kubeoncall
    spec:
      serviceAccountName: kubernetes-mutation-adapter
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: kubeoncall/kubernetes-mutation-adapter:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: KUBERNETES_MUTATION_ADAPTER_CLUSTER_ID
              value: local
            - name: KUBERNETES_MUTATION_ADAPTER_ALLOWED_NAMESPACES
              value: kubeoncall-system
            - name: KUBERNETES_MUTATION_ADAPTER_LEDGER_NAMESPACE
              value: kubeoncall-operations
            - name: KUBERNETES_MUTATION_ADAPTER_ALLOWED_ACTIONS
              value: rolloutRestart,rolloutUndo,scaleWorkload
            - name: KUBERNETES_MUTATION_ADAPTER_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kubernetes-mutation-adapter-auth
                  key: token
            - name: KUBERNETES_MUTATION_ADAPTER_REQUEST_TIMEOUT
              value: 15s
            - name: KUBERNETES_MUTATION_ADAPTER_MAX_CONCURRENT
              value: "4"
            - name: KUBERNETES_MUTATION_ADAPTER_MAX_REPLICAS
              value: "20"
            - name: KUBERNETES_MUTATION_ADAPTER_LEDGER_RETENTION
              value: 720h
            - name: KUBERNETES_MUTATION_ADAPTER_LEDGER_CLEANUP_INTERVAL
              value: 1h
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mutation-adapter
  namespace: kubeoncall-operations
  labels:
    app.kubernetes.io/name: kubernetes-mutation-adapter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubernetes-mutation-adapter
  ports:
    - name: http
      port: 8080
      targetPort: http
