{{- if or .Values.quickstart.enabled .Values.secrets.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secrets.existingSecret }}
{{- $minioAccessKey := randAlphaNum 20 }}
{{- $minioSecretKey := randAlphaNum 40 }}
{{- $mysqlPassword := randAlphaNum 32 }}
{{- $mysqlMigrationPassword := randAlphaNum 32 }}
{{- $mysqlRootPassword := randAlphaNum 32 }}
{{- $bootstrapAdminPassword := randAlphaNum 32 }}
{{- $sandboxHmac := randAlphaNum 64 }}
{{- $apiViewerToken := randAlphaNum 48 }}
{{- $apiOperatorToken := randAlphaNum 48 }}
{{- $apiAdminToken := randAlphaNum 48 }}
{{- $aliyunApiKey := "" }}
{{- if and $existing $existing.data }}
{{- if hasKey $existing.data .Values.secrets.minioAccessKeyKey }}{{- $minioAccessKey = index $existing.data .Values.secrets.minioAccessKeyKey | b64dec }}{{- end }}
{{- if hasKey $existing.data .Values.secrets.minioSecretKeyKey }}{{- $minioSecretKey = index $existing.data .Values.secrets.minioSecretKeyKey | b64dec }}{{- end }}
{{- if hasKey $existing.data .Values.secrets.mysqlPasswordKey }}{{- $mysqlPassword = index $existing.data .Values.secrets.mysqlPasswordKey | b64dec }}{{- end }}
{{- if hasKey $existing.data .Values.secrets.mysqlMigrationPasswordKey }}{{- $mysqlMigrationPassword = index $existing.data .Values.secrets.mysqlMigrationPasswordKey | b64dec }}{{- end }}
{{- if hasKey $existing.data .Values.secrets.mysqlRootPasswordKey }}{{- $mysqlRootPassword = index $existing.data .Values.secrets.mysqlRootPasswordKey | b64dec }}{{- end }}
{{- if hasKey $existing.data .Values.secrets.bootstrapAdminPasswordKey }}{{- $bootstrapAdminPassword = index $existing.data .Values.secrets.bootstrapAdminPasswordKey | b64dec }}{{- end }}
{{- if hasKey $existing.data .Values.sandboxController.backendHmacSecretKey }}{{- $sandboxHmac = index $existing.data .Values.sandboxController.backendHmacSecretKey | b64dec }}{{- end }}
{{- if hasKey $existing.data .Values.secrets.apiViewerTokenKey }}{{- $apiViewerToken = index $existing.data .Values.secrets.apiViewerTokenKey | b64dec }}{{- end }}
{{- if hasKey $existing.data .Values.secrets.apiOperatorTokenKey }}{{- $apiOperatorToken = index $existing.data .Values.secrets.apiOperatorTokenKey | b64dec }}{{- end }}
{{- if hasKey $existing.data .Values.secrets.apiAdminTokenKey }}{{- $apiAdminToken = index $existing.data .Values.secrets.apiAdminTokenKey | b64dec }}{{- end }}
{{- if hasKey $existing.data .Values.secrets.aliyunApiKeyKey }}{{- $aliyunApiKey = index $existing.data .Values.secrets.aliyunApiKeyKey | b64dec }}{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: managed-secret
type: Opaque
data:
  {{ .Values.secrets.minioAccessKeyKey }}: {{ $minioAccessKey | b64enc | quote }}
  {{ .Values.secrets.minioSecretKeyKey }}: {{ $minioSecretKey | b64enc | quote }}
  {{ .Values.secrets.mysqlPasswordKey }}: {{ $mysqlPassword | b64enc | quote }}
  {{ .Values.secrets.mysqlMigrationPasswordKey }}: {{ $mysqlMigrationPassword | b64enc | quote }}
  {{ .Values.secrets.mysqlRootPasswordKey }}: {{ $mysqlRootPassword | b64enc | quote }}
  {{ .Values.secrets.bootstrapAdminPasswordKey }}: {{ $bootstrapAdminPassword | b64enc | quote }}
  {{ .Values.sandboxController.backendHmacSecretKey }}: {{ $sandboxHmac | b64enc | quote }}
  {{ .Values.secrets.apiViewerTokenKey }}: {{ $apiViewerToken | b64enc | quote }}
  {{ .Values.secrets.apiOperatorTokenKey }}: {{ $apiOperatorToken | b64enc | quote }}
  {{ .Values.secrets.apiAdminTokenKey }}: {{ $apiAdminToken | b64enc | quote }}
{{- if $aliyunApiKey }}
  {{ .Values.secrets.aliyunApiKeyKey }}: {{ $aliyunApiKey | b64enc | quote }}
{{- end }}
{{- if and .Values.sandboxController.enabled (or (ne .Release.Namespace .Values.sandboxController.namespace) (ne .Values.secrets.existingSecret .Values.sandboxController.existingSecret)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.sandboxController.existingSecret }}
  namespace: {{ .Values.sandboxController.namespace }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-controller-secret
type: Opaque
data:
  {{ .Values.sandboxController.backendHmacSecretKey }}: {{ $sandboxHmac | b64enc | quote }}
{{- end }}
{{- end }}
