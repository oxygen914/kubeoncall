{{- if .Values.quickstart.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeoncall.fullname" . }}-mysql-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: quickstart-mysql
data:
  01-create-database-users.sh: |
    #!/bin/sh
    set -eu
    mysql --protocol=socket --user=root --password="${MYSQL_ROOT_PASSWORD}" <<SQL
    CREATE USER IF NOT EXISTS '${MYSQL_MIGRATION_USER}'@'%' IDENTIFIED BY '${MYSQL_MIGRATION_PASSWORD}';
    GRANT ALL PRIVILEGES ON \`${MYSQL_DATABASE}\`.* TO '${MYSQL_MIGRATION_USER}'@'%';
    REVOKE ALL PRIVILEGES, GRANT OPTION FROM '${MYSQL_USER}'@'%';
    GRANT SELECT, INSERT, UPDATE, DELETE, EXECUTE ON \`${MYSQL_DATABASE}\`.* TO '${MYSQL_USER}'@'%';
    FLUSH PRIVILEGES;
    SQL
---
{{- if .Values.quickstart.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubeoncall.fullname" . }}-mysql-data
  namespace: {{ .Release.Namespace }}
  {{- if .Values.quickstart.persistence.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: quickstart-mysql
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.quickstart.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.quickstart.persistence.mysql.size | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubeoncall.fullname" . }}-redis-data
  namespace: {{ .Release.Namespace }}
  {{- if .Values.quickstart.persistence.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: quickstart-redis
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.quickstart.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.quickstart.persistence.redis.size | quote }}
---
{{- if .Values.quickstart.elasticsearch.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubeoncall.fullname" . }}-elasticsearch-data
  namespace: {{ .Release.Namespace }}
  {{- if .Values.quickstart.persistence.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: quickstart-elasticsearch
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.quickstart.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.quickstart.persistence.elasticsearch.size | quote }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubeoncall.fullname" . }}-minio-data
  namespace: {{ .Release.Namespace }}
  {{- if .Values.quickstart.persistence.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: quickstart-minio
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.quickstart.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.quickstart.persistence.minio.size | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: quickstart-mysql
spec:
  selector:
    app.kubernetes.io/name: {{ include "kubeoncall.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: quickstart-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeoncall.fullname" . }}-mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: quickstart-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubeoncall.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: quickstart-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubeoncall.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: quickstart-mysql
    spec:
      containers:
        - name: mysql
          image: {{ .Values.quickstart.mysql.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.username | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.mysqlPasswordKey }}
            - name: MYSQL_MIGRATION_USER
              value: {{ .Values.mysql.migrationUsername | quote }}
            - name: MYSQL_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.mysqlMigrationPasswordKey }}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.mysqlRootPasswordKey }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"${MYSQL_ROOT_PASSWORD}\""]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"${MYSQL_ROOT_PASSWORD}\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.quickstart.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-create-database-users.sh
              subPath: 01-create-database-users.sh
              readOnly: true
      volumes:
        - name: data
          {{- if .Values.quickstart.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kubeoncall.fullname" . }}-mysql-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: init
          configMap:
            name: {{ include "kubeoncall.fullname" . }}-mysql-init
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: quickstart-redis
spec:
  selector:
    app.kubernetes.io/name: {{ include "kubeoncall.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: quickstart-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeoncall.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: quickstart-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubeoncall.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: quickstart-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubeoncall.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: quickstart-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.quickstart.redis.image | quote }}
          {{- if .Values.quickstart.persistence.enabled }}
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
          {{- else }}
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          {{- end }}
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.quickstart.redis.resources | nindent 12 }}
          {{- if .Values.quickstart.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if .Values.quickstart.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kubeoncall.fullname" . }}-redis-data
      {{- end }}
---
{{- if .Values.quickstart.elasticsearch.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: quickstart-elasticsearch
spec:
  selector:
    app.kubernetes.io/name: {{ include "kubeoncall.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: quickstart-elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeoncall.fullname" . }}-elasticsearch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: quickstart-elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubeoncall.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: quickstart-elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubeoncall.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: quickstart-elasticsearch
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: {{ .Values.quickstart.elasticsearch.image | quote }}
          ports:
            - name: http
              containerPort: 9200
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "false"}
            - {name: node.store.allow_mmap, value: "false"}
            - {name: ES_JAVA_OPTS, value: {{ .Values.quickstart.elasticsearch.javaOpts | quote }}}
          readinessProbe:
            httpGet: {path: /_cluster/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml .Values.quickstart.elasticsearch.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          {{- if .Values.quickstart.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kubeoncall.fullname" . }}-elasticsearch-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kubeoncall
    app.kubernetes.io/component: quickstart-minio
spec:
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: quickstart-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeoncall.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kubeoncall
    app.kubernetes.io/component: quickstart-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: quickstart-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: quickstart-minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.quickstart.minio.image | quote }}
          args: ["server", "/data"]
          ports:
            - name: api
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.minioAccessKeyKey }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.minioSecretKeyKey }}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /minio/health/live, port: api}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.quickstart.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.quickstart.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kubeoncall.fullname" . }}-minio-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubeoncall.fullname" . }}-minio-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: quickstart-minio-init
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubeoncall.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: quickstart-minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: {{ .Values.quickstart.minio.clientImage | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - >-
              until mc alias set local http://minio:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}";
              do sleep 2; done;
              mc mb --ignore-existing "local/${MINIO_BUCKET}"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.minioAccessKeyKey }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.minioSecretKeyKey }}
            - name: MINIO_BUCKET
              value: {{ .Values.quickstart.minio.bucket | quote }}
{{- end }}
