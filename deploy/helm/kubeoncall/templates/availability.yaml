{{- if and .Values.podDisruptionBudget.enabled (not .Values.quickstart.enabled) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kubeoncall.fullname" . }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubeoncall.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
{{- end }}
{{- if and .Values.console.enabled .Values.console.podDisruptionBudget.enabled (not .Values.quickstart.enabled) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kubeoncall.fullname" . }}-console
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  maxUnavailable: {{ .Values.console.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubeoncall.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: console
{{- end }}
{{- if and .Values.autoscaling.enabled (not .Values.quickstart.enabled) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kubeoncall.fullname" . }}
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "kubeoncall.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
{{- if and .Values.console.enabled .Values.console.autoscaling.enabled (not .Values.quickstart.enabled) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kubeoncall.fullname" . }}-console
  labels:
    {{- include "kubeoncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "kubeoncall.fullname" . }}-console
  minReplicas: {{ .Values.console.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.console.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.console.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.console.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
