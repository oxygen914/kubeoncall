{{- if .Values.sandboxController.enabled }}
{{- if or .Values.sandboxController.createNamespace .Values.quickstart.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sandboxController.namespace }}
  labels:
    app.kubernetes.io/part-of: kubeoncall-sandbox
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-controller
  namespace: {{ .Values.sandboxController.namespace }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-controller
  namespace: {{ .Values.sandboxController.namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-controller
  namespace: {{ .Values.sandboxController.namespace }}
subjects:
  - kind: ServiceAccount
    name: sandbox-controller
    namespace: {{ .Values.sandboxController.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-controller
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-runtime
  namespace: {{ .Values.sandboxController.namespace }}
spec:
  hard:
    pods: {{ .Values.sandboxController.quota.pods | quote }}
    requests.cpu: {{ .Values.sandboxController.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.sandboxController.quota.requestsMemory | quote }}
    limits.cpu: {{ .Values.sandboxController.quota.limitsCpu | quote }}
    limits.memory: {{ .Values.sandboxController.quota.limitsMemory | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-container-limits
  namespace: {{ .Values.sandboxController.namespace }}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: "1", memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-controller
  namespace: {{ .Values.sandboxController.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: sandbox-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sandbox-controller}
    spec:
      serviceAccountName: sandbox-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "kubeoncall.imageRef" (dict "root" . "image" .Values.sandboxController.image) | quote }}
          imagePullPolicy: {{ .Values.sandboxController.image.pullPolicy }}
          ports: [{name: http, containerPort: 8088}]
          env:
            - name: SANDBOX_CONTROLLER_BACKEND_KEY_ID
              value: {{ .Values.sandboxController.backendKeyId | quote }}
            - name: SANDBOX_CONTROLLER_BACKEND_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sandboxController.existingSecret }}
                  key: {{ .Values.sandboxController.backendHmacSecretKey }}
            - name: SANDBOX_CONTROLLER_NAMESPACE
              value: {{ .Values.sandboxController.namespace | quote }}
            {{- if .Values.sandboxTools.catalog.enabled }}
            - name: SANDBOX_CONTROLLER_TOOL_CATALOG_PATH
              value: {{ .Values.sandboxTools.catalog.mountPath | quote }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources: {{- toYaml .Values.sandboxController.resources | nindent 12 }}
          {{- if .Values.sandboxTools.catalog.enabled }}
          volumeMounts:
            - name: sandbox-tool-catalog
              mountPath: {{ .Values.sandboxTools.catalog.mountPath | quote }}
              subPath: tools.yaml
              readOnly: true
          {{- end }}
      {{- if .Values.sandboxTools.catalog.enabled }}
      volumes:
        - name: sandbox-tool-catalog
          configMap:
            name: {{ include "kubeoncall.sandboxCatalogName" . }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-controller
  namespace: {{ .Values.sandboxController.namespace }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: sandbox-controller}
  ports: [{name: http, port: {{ .Values.sandboxController.service.port }}, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-controller-ingress
  namespace: {{ .Values.sandboxController.namespace }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: sandbox-controller}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "kubeoncall.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: backend
      ports: [{protocol: TCP, port: 8088}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}, {protocol: TCP, port: 443}]
    {{- if .Values.quickstart.enabled }}
    # Quickstart targets disposable Kind/Minikube clusters whose API Service CIDR is not known at
    # chart-render time. Limit this evaluation-only exception to HTTPS; production supplies the
    # exact API CIDR through controllerExtraEgress.
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
    {{- with .Values.sandboxController.networkPolicy.controllerExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-job-default-deny
  namespace: {{ .Values.sandboxController.namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: kubeoncall-sandbox}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    # The only non-DNS egress path is the in-release MinIO service. Jobs receive a short-lived,
    # object-scoped URL from Backend; they never receive MinIO access keys or general egress.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: minio}
      ports: [{protocol: TCP, port: 9000}]
    {{- with .Values.sandboxController.networkPolicy.jobExtraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
