{{- if .Values.sandboxController.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sandboxController.namespace }}
  labels:
    app.kubernetes.io/part-of: kubeoncall-sandbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-controller
  namespace: {{ .Values.sandboxController.namespace }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-controller
  namespace: {{ .Values.sandboxController.namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-controller
  namespace: {{ .Values.sandboxController.namespace }}
subjects:
  - kind: ServiceAccount
    name: sandbox-controller
    namespace: {{ .Values.sandboxController.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-controller
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-runtime
  namespace: {{ .Values.sandboxController.namespace }}
spec:
  hard:
    pods: {{ .Values.sandboxController.quota.pods | quote }}
    requests.cpu: {{ .Values.sandboxController.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.sandboxController.quota.requestsMemory | quote }}
    limits.cpu: {{ .Values.sandboxController.quota.limitsCpu | quote }}
    limits.memory: {{ .Values.sandboxController.quota.limitsMemory | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandbox-container-limits
  namespace: {{ .Values.sandboxController.namespace }}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: "1", memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-controller
  namespace: {{ .Values.sandboxController.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: sandbox-controller}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sandbox-controller}
    spec:
      serviceAccountName: sandbox-controller
      containers:
        - name: controller
          image: "{{ .Values.sandboxController.image.repository }}{{ if .Values.sandboxController.image.digest }}@{{ .Values.sandboxController.image.digest }}{{ else }}:{{ .Values.sandboxController.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.sandboxController.image.pullPolicy }}
          ports: [{name: http, containerPort: 8088}]
          env:
            - name: SANDBOX_CONTROLLER_BACKEND_KEY_ID
              value: {{ .Values.sandboxController.backendKeyId | quote }}
            - name: SANDBOX_CONTROLLER_BACKEND_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.sandboxController.backendHmacSecretKey }}
            - name: SANDBOX_CONTROLLER_SANDBOX_NAMESPACE
              value: {{ .Values.sandboxController.namespace | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
          resources: {{- toYaml .Values.sandboxController.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-controller
  namespace: {{ .Values.sandboxController.namespace }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: sandbox-controller}
  ports: [{name: http, port: {{ .Values.sandboxController.service.port }}, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-controller-ingress
  namespace: {{ .Values.sandboxController.namespace }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: sandbox-controller}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}}
      ports: [{protocol: TCP, port: 8088}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}, {protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-job-default-deny
  namespace: {{ .Values.sandboxController.namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: kubeoncall-sandbox}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- end }}
