services:
  kubeoncall:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KUBEONCALL_API_AUTH_ENABLED: ${KUBEONCALL_API_AUTH_ENABLED:-false}
      KUBEONCALL_API_VIEWER_TOKEN: ${KUBEONCALL_API_VIEWER_TOKEN:-}
      KUBEONCALL_API_OPERATOR_TOKEN: ${KUBEONCALL_API_OPERATOR_TOKEN:-}
      KUBEONCALL_API_ADMIN_TOKEN: ${KUBEONCALL_API_ADMIN_TOKEN:-}
      APPROVAL_RESUME_LEASE_SECONDS: ${APPROVAL_RESUME_LEASE_SECONDS:-300}
      SPRING_AI_OPENAI_API_KEY: ${ALIYUN_API_KEY:-}
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:-qwen-plus}
      RAG_EMBEDDING_API_KEY: ${ALIYUN_API_KEY:-}
      RAG_EMBEDDING_ENDPOINT: ${RAG_EMBEDDING_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-v4}
      RAG_EMBEDDING_VERSION: ${RAG_EMBEDDING_VERSION:-v1}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-1536}
      RAG_EMBEDDING_TIMEOUT_MILLIS: ${RAG_EMBEDDING_TIMEOUT_MILLIS:-3000}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-32}
      RAG_RERANK_API_KEY: ${RAG_RERANK_API_KEY:-${ALIYUN_API_KEY:-}}
      RAG_RERANK_ENDPOINT: ${RAG_RERANK_ENDPOINT:-https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
      RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-qwen3-rerank}
      RAG_RERANK_TIMEOUT_MILLIS: ${RAG_RERANK_TIMEOUT_MILLIS:-3000}
      RAG_AUGMENTATION_ENABLED: ${RAG_AUGMENTATION_ENABLED:-false}
      RAG_AUGMENTATION_ENDPOINT: ${RAG_AUGMENTATION_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      RAG_AUGMENTATION_API_KEY: ${RAG_AUGMENTATION_API_KEY:-${ALIYUN_API_KEY:-}}
      RAG_AUGMENTATION_MODEL: ${RAG_AUGMENTATION_MODEL:-qwen-plus}
      RAG_AUGMENTATION_VERSION: ${RAG_AUGMENTATION_VERSION:-v1}
      RAG_AUGMENTATION_TIMEOUT_MILLIS: ${RAG_AUGMENTATION_TIMEOUT_MILLIS:-10000}
      RAG_AUGMENTATION_CONCURRENCY: ${RAG_AUGMENTATION_CONCURRENCY:-2}
      RAG_AUTO_BIND_DATASET_VERSION: ${RAG_AUTO_BIND_DATASET_VERSION:-false}
      RAG_JSONL_MAX_PAYLOAD_BYTES: ${RAG_JSONL_MAX_PAYLOAD_BYTES:-5242880}
      RAG_JSONL_MAX_LINES: ${RAG_JSONL_MAX_LINES:-10000}
      RAG_DOCUMENT_MAX_CONTENT_BYTES: ${RAG_DOCUMENT_MAX_CONTENT_BYTES:-2097152}
      MEMORY_LLM_EXTRACTION_ENABLED: ${MEMORY_LLM_EXTRACTION_ENABLED:-false}
      MEMORY_LLM_EXTRACTION_ENDPOINT: ${MEMORY_LLM_EXTRACTION_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      MEMORY_LLM_EXTRACTION_API_KEY: ${MEMORY_LLM_EXTRACTION_API_KEY:-${ALIYUN_API_KEY:-}}
      MEMORY_LLM_EXTRACTION_MODEL: ${MEMORY_LLM_EXTRACTION_MODEL:-qwen-plus}
      MEMORY_EXTRACTION_PROCESSING_TIMEOUT_SECONDS: ${MEMORY_EXTRACTION_PROCESSING_TIMEOUT_SECONDS:-300}
      MEMORY_EXTRACTION_RECLAIM_LIMIT: ${MEMORY_EXTRACTION_RECLAIM_LIMIT:-100}
      MEMORY_SEMANTIC_DUPLICATE_ENABLED: ${MEMORY_SEMANTIC_DUPLICATE_ENABLED:-false}
      MEMORY_SEMANTIC_DUPLICATE_WEIGHT: ${MEMORY_SEMANTIC_DUPLICATE_WEIGHT:-0.75}
      MEMORY_TOKENIZER_ENABLED: ${MEMORY_TOKENIZER_ENABLED:-false}
      MEMORY_TOKENIZER_ENDPOINT: ${MEMORY_TOKENIZER_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      MEMORY_TOKENIZER_API_KEY: ${MEMORY_TOKENIZER_API_KEY:-${ALIYUN_API_KEY:-}}
      MEMORY_TOKENIZER_MODEL: ${MEMORY_TOKENIZER_MODEL:-qwen-plus}
      MEMORY_TOKENIZER_MODE: ${MEMORY_TOKENIZER_MODE:-chat_usage}
      MEMORY_TOKENIZER_CHAT_OVERHEAD_TOKENS: ${MEMORY_TOKENIZER_CHAT_OVERHEAD_TOKENS:--1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MCP_ENDPOINT: ${MCP_ENDPOINT:-http://host.docker.internal:18080/mcp/call}
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-static_bearer}
      MCP_OAUTH_TOKEN_ENDPOINT: ${MCP_OAUTH_TOKEN_ENDPOINT:-}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      MCP_OAUTH_CLIENT_AUTH_METHOD: ${MCP_OAUTH_CLIENT_AUTH_METHOD:-client_secret_post}
      MCP_OAUTH_SCOPE: ${MCP_OAUTH_SCOPE:-}
      MCP_OAUTH_RESOURCE: ${MCP_OAUTH_RESOURCE:-}
      MCP_OAUTH_REFRESH_SKEW_SECONDS: ${MCP_OAUTH_REFRESH_SKEW_SECONDS:-30}
      MCP_PROTOCOL: ${MCP_PROTOCOL:-custom}
      MCP_PROTOCOL_VERSION: ${MCP_PROTOCOL_VERSION:-2025-11-25}
      MCP_CLIENT_NAME: ${MCP_CLIENT_NAME:-kubeoncall}
      MCP_CLIENT_VERSION: ${MCP_CLIENT_VERSION:-1.0.0}
      MCP_DISCOVERY_ENABLED: ${MCP_DISCOVERY_ENABLED:-false}
      MCP_DISCOVERY_ENDPOINT: ${MCP_DISCOVERY_ENDPOINT:-}
      MCP_DISCOVERY_CACHE_SECONDS: ${MCP_DISCOVERY_CACHE_SECONDS:-60}
      MCP_DISCOVERY_MAX_PAGES: ${MCP_DISCOVERY_MAX_PAGES:-20}
      MCP_DISCOVERY_REFRESH_MILLIS: ${MCP_DISCOVERY_REFRESH_MILLIS:-60000}
      MCP_DYNAMIC_INVOCATION_ENABLED: ${MCP_DYNAMIC_INVOCATION_ENABLED:-false}
      MCP_DYNAMIC_MAX_TOOLS: ${MCP_DYNAMIC_MAX_TOOLS:-3}
      MCP_MAX_RESPONSE_BYTES: ${MCP_MAX_RESPONSE_BYTES:-262144}
      MCP_ALLOWED_TOOLS: ${MCP_ALLOWED_TOOLS:-knowledge.searchSop,topology.getServiceTopology,cmdb.getServiceMetadata,kubernetes.describeResource,prometheus.queryRange,alerts.getActiveAlerts,inventory.*,metrics.*}
      CHANGE_EVENT_WEBHOOK_ENABLED: ${CHANGE_EVENT_WEBHOOK_ENABLED:-false}
      CHANGE_EVENT_WEBHOOK_AUTH_MODE: ${CHANGE_EVENT_WEBHOOK_AUTH_MODE:-bearer}
      CHANGE_EVENT_WEBHOOK_TOKEN: ${CHANGE_EVENT_WEBHOOK_TOKEN:-}
      CHANGE_EVENT_WEBHOOK_MAX_PAYLOAD_BYTES: ${CHANGE_EVENT_WEBHOOK_MAX_PAYLOAD_BYTES:-1048576}
      CHANGE_EVENT_GITHUB_WEBHOOK_SECRET: ${CHANGE_EVENT_GITHUB_WEBHOOK_SECRET:-}
      CHANGE_EVENT_GITLAB_WEBHOOK_TOKEN: ${CHANGE_EVENT_GITLAB_WEBHOOK_TOKEN:-}
      CHANGE_EVENT_JENKINS_WEBHOOK_TOKEN: ${CHANGE_EVENT_JENKINS_WEBHOOK_TOKEN:-}
      CHANGE_EVENT_ARGOCD_WEBHOOK_TOKEN: ${CHANGE_EVENT_ARGOCD_WEBHOOK_TOKEN:-}
      KUBERNETES_TOOL_ENDPOINT: ${KUBERNETES_TOOL_ENDPOINT:-http://host.docker.internal:18081/api/tools/kubernetes}
      PROMETHEUS_TOOL_ENDPOINT: ${PROMETHEUS_TOOL_ENDPOINT:-http://prometheus:9090}
      ALERTMANAGER_TOOL_ENDPOINT: ${ALERTMANAGER_TOOL_ENDPOINT:-http://host.docker.internal:18083/api/tools/alertmanager}
      ALERT_NOTIFICATION_WEBHOOK_ENDPOINT: ${ALERT_NOTIFICATION_WEBHOOK_ENDPOINT:-}
      ALERT_NOTIFICATION_WEBHOOK_TIMEOUT_MILLIS: ${ALERT_NOTIFICATION_WEBHOOK_TIMEOUT_MILLIS:-3000}
      INCIDENT_TOOL_ENDPOINT: ${INCIDENT_TOOL_ENDPOINT:-http://host.docker.internal:18087/api/tools/incident}
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  prometheus:
    image: prom/prometheus:v2.53.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    depends_on:
      kubeoncall:
        condition: service_started

  alertmanager:
    profiles: [alerting]
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/alertmanager/secrets/kubeoncall-webhook-token:/etc/alertmanager/secrets/kubeoncall-webhook-token:ro
    ports:
      - "9093:9093"
    depends_on:
      kubeoncall:
        condition: service_started

  node-exporter:
    profiles: [alerting]
    image: prom/node-exporter:v1.8.2
    ports:
      - "9100:9100"

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
