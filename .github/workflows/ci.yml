name: ci

on:
  push:
    branches: [main, "agent/**", "codex/**"]
  pull_request:

permissions:
  contents: read

# Third-party Actions are pinned to immutable commit SHAs; update them only through a reviewed
# dependency change that reruns this complete workflow.
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # MySQL service container so the Testcontainers ITs (and any JDBC-path tests) can run without
      # pulling an image at runtime. The backend ITs create their own databases via Testcontainers,
      # but having MySQL available lets the default gate also exercise the integration-test profile.
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: kubeoncall
          MYSQL_USER: kubeoncall
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Backend: default unit tests + the integration-test profile (Testcontainers ITs). The profile
      # runs Failsafe *IT classes; Testcontainers reuses the Docker daemon available on the runner.
      - name: Backend verify (unit + integration-test profile)
        run: ./mvnw --batch-mode --no-transfer-progress verify -Pintegration-test
        working-directory: backend
      - name: Prepare tested Backend release JAR
        shell: bash
        run: |
          jar_path="$(find target -maxdepth 1 -name 'kubeoncall-*.jar' ! -name '*.original' -print -quit)"
          test -n "${jar_path}"
          cp "${jar_path}" target/kubeoncall.jar
        working-directory: backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kubeoncall-backend-jar
          path: backend/target/kubeoncall.jar
          if-no-files-found: error
      # Generate the source-controlled OpenAPI contract from the running backend. A following diff
      # check makes an endpoint or payload change fail CI until its frontend type contract is
      # regenerated deliberately.
      - name: Generate and verify OpenAPI contract
        run: |
          ./mvnw --batch-mode --no-transfer-progress verify -Popenapi-contract
          git diff --exit-code -- api/openapi.json
        working-directory: backend
      # Frontend: install, typecheck, lint, unit tests, production build — the full quality gate the
      # plan requires, in dependency order so a failure stops the job early.
      - name: Frontend install
        run: npm ci
        working-directory: frontend
      - name: Verify generated OpenAPI client types
        run: npm run api:check
        working-directory: frontend
      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      - name: Frontend formatting
        run: npm run format:check
        working-directory: frontend
      - name: Cross-language source responsibility budgets
        run: bash scripts/verify-source-size.sh
      - name: Frontend unit tests
        run: npm run test
        working-directory: frontend
      - name: Frontend production build
        run: npm run build
        working-directory: frontend
      - name: Compose config validation
        run: docker compose config --quiet
      - name: Helm release packaging validation
        run: ./scripts/verify-release-packaging.sh

  sandbox-controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox-controller
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: sandbox-controller/go.mod
          cache-dependency-path: sandbox-controller/go.sum
      - name: Controller formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf 'Go files must be formatted with gofmt:\n%s\n' "${unformatted}" >&2
            exit 1
          fi
      - name: Controller test and vet
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/...
      # A bounded fuzz pass executes the seed corpus and short mutations on every change; it is
      # intentionally separate from ordinary unit tests so malformed internal requests cannot
      # regress into a panic without failing CI.
      - name: Controller authentication fuzz regression
        run: go test -run=^$ -fuzz=FuzzAuthenticatorRejectsMalformedInput -fuzztime=10s ./internal/httpapi

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run Playwright smoke
        run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report

  package:
    runs-on: ubuntu-latest
    needs: [test, sandbox-controller]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kubeoncall-backend-jar
          path: backend/target
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./deploy/local/Dockerfile.prebuilt
          push: false
          load: true
          tags: kubeoncall-backend:ci
      - name: Build console image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./frontend
          push: false
          load: true
          tags: kubeoncall-console:ci
      - name: Verify Console backend service template
        run: >-
          docker run --rm
          -e KUBEONCALL_BACKEND_HOST=release-kubeoncall
          -e KUBEONCALL_BACKEND_PORT=8080
          kubeoncall-console:ci
          sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh >/dev/null &&
          grep -q "proxy_pass http://release-kubeoncall:8080;" /etc/nginx/conf.d/default.conf'
      - name: Build sandbox controller image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./sandbox-controller
          push: false
          load: true
          tags: kubeoncall-sandbox-controller:ci
      - name: Build read-only Kubernetes adapter image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./sandbox-controller
          file: ./sandbox-controller/Dockerfile.kubernetes-tool-adapter
          push: false
          load: true
          tags: kubeoncall-kubernetes-tool-adapter:ci
      - name: Build governed Kubernetes mutation adapter image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./sandbox-controller
          file: ./sandbox-controller/Dockerfile.kubernetes-mutation-adapter
          push: false
          load: true
          tags: kubeoncall-kubernetes-mutation-adapter:ci
      - name: Build generated Python runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./sandbox-runtimes/generated-code
          file: ./sandbox-runtimes/generated-code/python/Dockerfile
          push: false
          load: true
          tags: kubeoncall-sandbox-generated-python:ci
      - name: Build generated POSIX shell runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./sandbox-runtimes/generated-code
          file: ./sandbox-runtimes/generated-code/posix-shell/Dockerfile
          push: false
          load: true
          tags: kubeoncall-sandbox-generated-posix-shell:ci
      - name: Build manifest validation runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./sandbox-runtimes/manifest-validation
          file: ./sandbox-runtimes/manifest-validation/Dockerfile
          push: false
          load: true
          tags: kubeoncall-sandbox-manifest-validation:ci
      - name: Smoke exact packaged images
        env:
          KUBEONCALL_BACKEND_IMAGE: kubeoncall-backend:ci
          KUBEONCALL_CONSOLE_IMAGE: kubeoncall-console:ci
          KUBEONCALL_SANDBOX_CONTROLLER_IMAGE: kubeoncall-sandbox-controller:ci
          KUBEONCALL_SANDBOX_PYTHON_IMAGE: kubeoncall-sandbox-generated-python:ci
          KUBEONCALL_SANDBOX_SHELL_IMAGE: kubeoncall-sandbox-generated-posix-shell:ci
          KUBEONCALL_SANDBOX_MANIFEST_IMAGE: kubeoncall-sandbox-manifest-validation:ci
        run: ./scripts/verify-release-image-runtime.sh
      # Record image digests. `load: true` makes the image available locally so `docker inspect`
      # resolves the digest; without it `RepoDigests` is empty and the step would fail (P1-3 fix).
      - name: Record image digests
        run: |
          {
            echo "backend image id: $(docker inspect --format='{{.Id}}' kubeoncall-backend:ci)"
            echo "console image id: $(docker inspect --format='{{.Id}}' kubeoncall-console:ci)"
            echo "sandbox controller image id: $(docker inspect --format='{{.Id}}' kubeoncall-sandbox-controller:ci)"
            echo "read-only Kubernetes adapter image id: $(docker inspect --format='{{.Id}}' kubeoncall-kubernetes-tool-adapter:ci)"
            echo "Kubernetes mutation adapter image id: $(docker inspect --format='{{.Id}}' kubeoncall-kubernetes-mutation-adapter:ci)"
            echo "generated Python image id: $(docker inspect --format='{{.Id}}' kubeoncall-sandbox-generated-python:ci)"
            echo "generated POSIX shell image id: $(docker inspect --format='{{.Id}}' kubeoncall-sandbox-generated-posix-shell:ci)"
            echo "manifest validation image id: $(docker inspect --format='{{.Id}}' kubeoncall-sandbox-manifest-validation:ci)"
          } >> digests.txt
          cat digests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-digests
          path: digests.txt
      - name: Export exact tested images
        run: |
          docker save --output kubeoncall-ci-images.tar \
            kubeoncall-backend:ci \
            kubeoncall-console:ci \
            kubeoncall-sandbox-controller:ci \
            kubeoncall-kubernetes-tool-adapter:ci \
            kubeoncall-kubernetes-mutation-adapter:ci \
            kubeoncall-sandbox-generated-python:ci \
            kubeoncall-sandbox-generated-posix-shell:ci \
            kubeoncall-sandbox-manifest-validation:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kubeoncall-ci-images
          path: kubeoncall-ci-images.tar
          if-no-files-found: error
          retention-days: 1

  scan:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kubeoncall-ci-images
          path: .
      - name: Load exact packaged images
        run: docker load --input kubeoncall-ci-images.tar
      # Trivy scans the exact images exported by the package job; no second build may drift from the
      # artifact that passed the packaging checks. HIGH/CRITICAL findings fail the gate.
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy scan console
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-console:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy scan sandbox controller
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-sandbox-controller:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy scan read-only Kubernetes adapter
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-kubernetes-tool-adapter:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy scan governed Kubernetes mutation adapter
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-kubernetes-mutation-adapter:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy scan generated Python runtime
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-sandbox-generated-python:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy scan generated POSIX shell runtime
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-sandbox-generated-posix-shell:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy scan manifest validation runtime
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-sandbox-manifest-validation:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      # CycloneDX is a standard, machine-consumable SBOM rather than Trivy's default scan report.
      - name: Generate backend CycloneDX SBOM
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-backend:ci
          format: cyclonedx
          output: backend-sbom.cdx.json
      - name: Generate console CycloneDX SBOM
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-console:ci
          format: cyclonedx
          output: console-sbom.cdx.json
      - name: Generate sandbox controller CycloneDX SBOM
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-sandbox-controller:ci
          format: cyclonedx
          output: sandbox-controller-sbom.cdx.json
      - name: Generate read-only Kubernetes adapter CycloneDX SBOM
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-kubernetes-tool-adapter:ci
          format: cyclonedx
          output: kubernetes-tool-adapter-sbom.cdx.json
      - name: Generate governed Kubernetes mutation adapter CycloneDX SBOM
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-kubernetes-mutation-adapter:ci
          format: cyclonedx
          output: kubernetes-mutation-adapter-sbom.cdx.json
      - name: Generate generated Python CycloneDX SBOM
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-sandbox-generated-python:ci
          format: cyclonedx
          output: sandbox-generated-python-sbom.cdx.json
      - name: Generate generated POSIX shell CycloneDX SBOM
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-sandbox-generated-posix-shell:ci
          format: cyclonedx
          output: sandbox-generated-posix-shell-sbom.cdx.json
      - name: Generate manifest validation CycloneDX SBOM
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          image-ref: kubeoncall-sandbox-manifest-validation:ci
          format: cyclonedx
          output: sandbox-manifest-validation-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cyclonedx-sbom
          path: |
            backend-sbom.cdx.json
            console-sbom.cdx.json
            sandbox-controller-sbom.cdx.json
            kubernetes-tool-adapter-sbom.cdx.json
            kubernetes-mutation-adapter-sbom.cdx.json
            sandbox-generated-python-sbom.cdx.json
            sandbox-generated-posix-shell-sbom.cdx.json
            sandbox-manifest-validation-sbom.cdx.json

  release-gate:
    runs-on: ubuntu-latest
    needs: [test, e2e, package, scan]
    steps:
      - run: |
          echo "All quality gates passed: backend, console, controller, sandbox runtimes, e2e, package, scan and SBOM"
