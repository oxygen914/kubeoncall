server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SSE is a long-lived response: it must bypass nginx buffering and retain the
    # connection through the heartbeat/reconnect window. Keep this exact location
    # before the general /api/ proxy so ordinary API traffic retains normal defaults.
    location = /api/v1/events/stream {
        proxy_pass http://${KUBEONCALL_BACKEND_HOST}:${KUBEONCALL_BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://${KUBEONCALL_BACKEND_HOST}:${KUBEONCALL_BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
